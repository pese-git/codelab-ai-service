events {
    worker_connections 1024;
}

http {
    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Базовые настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Настройки для WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream для auth-service
    upstream auth_backend {
        server codelab-auth-service:8003;
    }

    # Upstream для gateway-service
    upstream core_backend {
        server codelab-core-service:8000;
    }

    # Upstream для codelab-admin-frontend (Next.js)
    upstream admin_frontend {
        server codelab-admin-frontend:3010;
    }

    # Upstream для codelab-user-frontend (Next.js)
    upstream user_frontend {
        server codelab-user-frontend:3020;
    }

    server {
        listen 80;
        server_name localhost;

        # Увеличиваем размер буфера для больших запросов (соответствует Ingress: 50m)
        client_max_body_size 50M;
        client_body_buffer_size 128k;

        # Настройки для проксирования
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты (соответствует Ingress: 3600s для read/send)
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # ========================
        # Frontend Services Routes
        # ========================

        # Проксирование codelab-admin-frontend (Next.js приложение)
        location /admin/ {
            proxy_pass http://admin_frontend/;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
        }

        # Проксирование Next.js WebSocket для HMR (admin-frontend)
        location ~ ^/admin/_next/webpack-hmr {
            proxy_pass http://admin_frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Проксирование codelab-user-frontend (Next.js приложение)
        location /app/ {
            proxy_pass http://user_frontend/;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
        }

        # Проксирование Next.js WebSocket для HMR (user-frontend)
        location ~ ^/app/_next/webpack-hmr {
            proxy_pass http://user_frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ========================
        # Backend Services Routes
        # ========================

        # Проксирование auth-service JWKS endpoints (без префикса /auth)
        location /.well-known/ {
            proxy_pass http://auth_backend/.well-known/;
            
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
        }

        # Health check для auth-service
        location /auth-health {
            proxy_pass http://auth_backend/health;
        }

        # Health check для core_backend (публичный, без аутентификации)
        location /core-health {
            proxy_pass http://core_backend/health;
        }

        # Health check для auth-service
        location /auth-docs {
            proxy_pass http://auth_backend/docs;
        }

        # Health check для core_backend (публичный, без аутентификации)
        location /core-docs {
            proxy_pass http://core_backend/docs;
        }

        # Проксирование auth-service endpoints (/api/v1/auth/...)
        # ВАЖНО: этот блок должен быть ПЕРЕД более общим /api/v1/ блоком
        location /api/v1/auth/ {
            proxy_pass http://auth_backend/api/v1/auth/;
            
            # Дополнительные заголовки для auth
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
        }

        # Проксирование core_backend REST API (v1)
        # Охватывает /api/v1/core/* и другие v1 endpoints
        location /api/v1/ {
            proxy_pass http://core_backend/api/v1/;
            
            # Дополнительные заголовки для auth
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;

            # Таймауты соответствуют глобальным настройкам (3600s)
            # proxy_read_timeout и proxy_send_timeout наследуются
        }

        # Проксирование WebSocket соединений для core_backend
        location ~ ^/api/v1/ws/(.*)$ {
            proxy_pass http://core_backend/api/v1/ws/$1;
            
            # WebSocket специфичные заголовки
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Увеличенные таймауты для WebSocket
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            # Отключаем буферизацию для WebSocket
            proxy_buffering off;
        }

        # Главная страница nginx
        location = / {
            return 200 'Codelab AI Service Proxy\n\nAvailable endpoints:\n- /admin/* - Admin Frontend\n- /app/* - User Frontend\n- /api/v1/auth/* - Auth Service endpoints (register, oauth/token, password-reset, etc.)\n- /api/v1/core/* - Core Service endpoints (projects, agents, chat, approvals, etc.)\n- /.well-known/* - JWKS endpoints\n- /auth-health - Auth service health check\n- /core-health - Core service health check\n- /api/v1/ws/{session_id} - Core Service WebSocket\n- /nginx-health - Nginx health check\n';
            add_header Content-Type text/plain;
        }

        # Статус nginx
        location /nginx/health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
